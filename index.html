<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS Motion labs</title><style>
:root{--bg:#0b1220;--panel:#121b2e;--ink:#e6edf7;--muted:#9fb0c8;--line:#24324d;--accent:#22d3ee;
--accent-ink:#04222a;--amber:#fbbf24;--green:#34d399;--red:#f87171}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f8fb;--panel:#fff;
--ink:#0f172a;--muted:#475569;--line:#d6dde8;--accent:#0e7490;--accent-ink:#fff;--amber:#b45309;
--green:#047857;--red:#b91c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
.kicker{color:var(--amber);font-size:.85rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
h1{font-size:1.7rem;margin:.2em 0 .3em}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 1em}
ol.steps{padding-left:1.2em;margin:.5em 0 1.2em}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;position:sticky;bottom:0;
padding:10px 0;background:var(--bg);z-index:1}
button,.btn{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--panel);
color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none}
button.run{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;
padding:12px 26px;font-size:1.05rem}
button:disabled{opacity:.6;cursor:wait}
textarea,pre{width:100%;font:14px/1.45 ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0}
textarea{resize:vertical;white-space:pre;overflow:auto;tab-size:4}
pre{white-space:pre;overflow-x:auto;min-height:5em}
pre.err{color:var(--red)}
.label{color:var(--muted);font-size:.85rem;margin:14px 0 6px}
#status{color:var(--muted);font-size:.9rem}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
.q{margin:0 0 8px}
footer{color:var(--muted);font-size:.85rem;margin-top:28px}
code{font-family:ui-monospace,"DejaVu Sans Mono",monospace}
a{color:var(--accent)}
@media (max-width:600px){textarea,pre{font-size:12px;padding:10px}h1{font-size:1.45rem}
.bar .btn,#copy{display:none}}
 li{margin:.5em 0}</style></head>
<body><main><div class="kicker">CS Motion</div><h1>Try it yourself</h1>
<p>Short Python labs from the videos. Each runs in your browser: no install, no sign-up.</p>
<ul><li><a href="shared-counter-race/">Two servers said yes</a> <span class="meta">· Rate Limiter, Part 3 · ~3 min</span></li><li><a href="token-bucket/">Token bucket</a> <span class="meta">· Rate Limiter, Part 2 · ~3 min</span></li></ul></main></body></html>
